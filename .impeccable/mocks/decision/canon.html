<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<title>BeautyOS — Cânone categoria</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{width:1440px;height:900px;overflow:hidden;font:14px/1.4 Inter,system-ui,sans-serif;background:#f8fafc;color:#0f172a;display:flex}
  aside{width:240px;background:#fff;border-right:1px solid #e2e8f0;padding:20px}
  .logo{font-weight:700;font-size:16px;margin-bottom:24px}
  a{display:block;padding:10px 12px;border-radius:8px;color:#475569;text-decoration:none;margin-bottom:4px}
  a.on{background:#eff6ff;color:#1d4ed8;font-weight:600}
  main{flex:1;padding:24px}
  h1{font-size:20px;font-weight:700;margin-bottom:16px}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:16px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
  .card h3{font-size:13px;color:#64748b;font-weight:500}
  .card .n{font-size:24px;font-weight:700;margin-top:8px}
  .btn{display:inline-block;margin-top:20px;background:#2563eb;color:#fff;padding:10px 16px;border-radius:999px;font-weight:600;font-size:13px}
</style>
</head>
<body>
<aside>
  <div class="logo">BeautyOS</div>
  <a class="on" href="#">Agenda</a>
  <a href="#">Comandas</a>
  <a href="#">Caixa</a>
  <a href="#">Clientes</a>
</aside>
<main>
  <h1>Bom dia · 29 out</h1>
  <div class="grid">
    <div class="card"><h3>Faturamento</h3><div class="n">R$ 1.240</div></div>
    <div class="card"><h3>Comandas abertas</h3><div class="n">3</div></div>
    <div class="card"><h3>Alertas</h3><div class="n">1</div></div>
  </div>
  <span class="btn">Novo agendamento</span>
  <p style="margin-top:24px;color:#64748b;font-size:13px">Cânone da categoria: SaaS limpo azul — porta de saída se quiser o familiar.</p>
</main>
</body>
<!-- sketch-rev:2 -->
</html>
